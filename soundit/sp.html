<!DOCTYPE html>
<html lang="en">
<head>
	<script>window.update = function(){};</script>

	<title>Soundit - Spectrum Analyzer</title>
	<style>
	html,body{height:100%}
	body{padding:0;margin:0;background:#111;position:relative;z-index:2;overflow:hidden;}
	div{position:absolute;top:50%;left:0;right:0;z-index:1;margin-top:-18px;text-align:center;user-select:none;
		font-size:28px;color:#191919;pointer-events:none;opacity:.75;font-family:Arial}
	#e, #d, #f{
		cursor:pointer;
		position: absolute;
	    top: 7px;
	    right: 7px;
	    display: block;
	    height: 20px;
	    z-index: 99999;
	    background: #eaeaea;
	    left:auto;
	    border-radius:4px;
		color:#111;
		font:9px/20px Arial,sans-serif;
	    width: auto;
	    padding: 0 6px;
	    text-align: center;
	    opacity:0.9;
	    user-select:none;
	}

	.b #e, .b #d{
		top:12px;
	}

	#d{
		min-width:40px;
	}

	.b #e, .b #f{
		display:block;
	}

	#e{
		right: 68px;
	    width: 10px;
	    line-height: 20px;
	    padding: 0px 6px;
	    text-align: center;
	    opacity: 0.9;
	    display:none;
	}

	#f{
		left: 0;
	    right: 0;
	    top: 0;
	    padding: 0;
	    width: 100%;
	    line-height: 0;
	    border-radius: 0;
	    height: 4px;
	    background: #333;
	    display:none;
	    user-select:none;
	    -moz-user-select:none;
	}

	#d:focus-visible,#e:focus-visible{outline:2px solid #5af2ff;outline-offset:1px}

	.c #f, #f:hover{
		background:#3C3C3C;
	}

	</style>
	<meta charset="utf-8" />
</head>
<body>
	<canvas id="fr" width="600" height="188" style="width:100%;height:100%;display:block;cursor:pointer" aria-label="Spectrum analyser (click to pause)"></canvas>
	<div id="ttl">SPECTRUM ANALYSER</div>

	<a id="d" role="button" tabindex="0" onclick="dock()">DOCK</a>
	<a id="e" role="button" tabindex="0" aria-label="Close" onclick="remove()">X</a>
	<a id="f" onmousedown="drag(event)"></a>

	<script>
		var d = document;
		var w = window;
		var iframe = location.href.indexOf('?iframe') === -1 ? 0 : 1;

		/* 視窗文字走主視窗的 PKLocale；取不到就用英文 */
		function L ( key, fb ) {
			try {
				var h = iframe ? w.parent : w.opener;
				var s = h && h.PKLocale && h.PKLocale.t ( key );
				return s && s !== key ? s : fb;
			} catch (e) { return fb; }
		}
		d.getElementById ('ttl').textContent = L ('win.spec_analyser', 'SPECTRUM ANALYSER');
		d.getElementById ('d').textContent = L ('win.dock', 'DOCK');
		var canvas = d.getElementById('fr');
		var ctx = canvas.getContext('2d', {alpha:true, antialias:false});

		['d', 'e'].forEach (function ( id ) {
			d.getElementById (id).addEventListener ('keydown', function ( ev ) {
				if (ev.key === 'Enter') { ev.preventDefault (); ev.stopPropagation (); this.click (); }
			});
		});

		w.remove = function (){};
		if (iframe) {
			d.body.className = 'b';
			d.getElementById ('d').textContent = L ('win.undock', 'UNDOCK');
			w.remove = function () {
				w.parent.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'sp', [1, 1]);
			};
		};

		w.drag = function ( e ) {
			e.preventDefault ();
			e.stopPropagation ();

			w.parent.PKAudioEditor.ui.Dock ('RequestDragI', 'sp', [e.screenX, e.screenY]);
		};

		w.dock = function () {
			if (!iframe)
			{
				if (!w.opener || !w.opener.PKAudioEditor) {
					return ;
				}

				w.opener.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'sp', [1, 1]);
				w.close && w.close ();
			}
			else
			{
				var frm = w.parent.document.getElementById ('pk_fr' + 'sp');
				var t = 1;

				if (frm && frm.getBoundingClientRect) {
					var rect = frm.getBoundingClientRect ();
					t = [(w.parent.screenLeft + rect.left + 100)||0, (w.parent.screenTop + rect.top + 25)||0];
				}

				w.parent.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'sp', [t, 0]);
			}
		};

		/* 色階調色盤（和原本相同），但只算一次：0~255 → 'rgb(...)' 查表。
		 * 原本每一幀對每個頻帶都重新計算並組字串（每秒上萬次），這裡改成預先建表。 */
		var PALETTE = {
			0: [0,0,0],
			10: [75, 0, 159],
			20: [104,0,251],
			30: [131,0,255],
			40: [155,18,157],
			50: [175, 37, 0],
			60: [191, 59, 0],
			70: [206, 88, 0],
			80: [223, 132, 0],
			90: [240, 188, 0],
			100: [255, 252, 0]
		};
		var LUT = (function () {
			var out = [];
			for (var v = 0; v < 256; ++v) {
				var dec = 100 * v / 255;
				var fl = Math.min (100, 10 * Math.floor (dec / 10));
				var f = (dec - fl) / 10;
				var a = PALETTE[fl], b = PALETTE[Math.min (100, fl + 10)];
				out[v] = 'rgb(' + Math.round (a[0] + f * (b[0] - a[0])) + ',' +
					Math.round (a[1] + f * (b[1] - a[1])) + ',' +
					Math.round (a[2] + f * (b[2] - a[2])) + ')';
			}
			return out;
		})();

		/* 保留舊的全域函式名稱，避免別處有人呼叫 */
		w.getFullColor = function ( value ) {
			value = value > 255 ? 255 : value > 0 ? value >> 0 : 0;
			return LUT[ value ];
		};

		setTimeout(function () {
			if (!iframe)
			{
				if (!w.opener || !w.opener.PKAudioEditor) return ;
			}

			var value_changed = false;
			var paused = false;
			var speed_css = 3; /* 每幀往左捲動的 CSS 像素 */
			var ttl = d.getElementById ('ttl');

			/* 以裝置像素繪製（上限 2 倍）。尺寸改變時畫布會被清空，與原本行為相同 */
			function size () {
				var r = Math.min (w.devicePixelRatio || 1, 2);
				var pw = Math.round (w.innerWidth * r), ph = Math.round (w.innerHeight * r);
				if (canvas.width !== pw || canvas.height !== ph) {
					canvas.width = pw;
					canvas.height = ph;
				}
				return r;
			}

			size ();
			ctx.clearRect (0, 0, canvas.width, canvas.height);

			function draw ( data ) {
				var r = size ();
				var WIDTH = canvas.width, HEIGHT = canvas.height;
				var speed = Math.max (1, Math.round (speed_css * r));
				var n = data.length;
				if (!n) { value_changed = false; return ; }

				/* 直接把畫布自己往左平移，不用再多配一張暫存畫布（省一次整張複製） */
				ctx.globalCompositeOperation = 'copy';
				ctx.drawImage (canvas, speed, 0, WIDTH - speed, HEIGHT, 0, 0, WIDTH - speed, HEIGHT);
				ctx.globalCompositeOperation = 'source-over';

				/* 右側新的一欄：每個頻帶填滿自己的高度，不留縫（低頻在下） */
				var x = WIDTH - speed;
				var bottom = HEIGHT;
				for (var i = 0; i < n; ++i) {
					var top = HEIGHT - Math.round ((i + 1) * HEIGHT / n);
					if (bottom > top) {
						var v = data[i];
						ctx.fillStyle = LUT[v > 255 ? 255 : v > 0 ? v : 0];
						ctx.fillRect (x, top, speed, bottom - top);
					}
					bottom = top;
				}

				value_changed = false;
			};
			w.draw = draw;

			w.addEventListener ('pagehide', function () {
				w.destroy && w.destroy ( iframe );
				w.destroy = null;
			});

			w.update = function (freq_arr) {
				if (!freq_arr)
					ctx.clearRect (0, 0, canvas.width, canvas.height);
				else {
					if (paused || value_changed) return ;
					value_changed = true;

					window.requestAnimationFrame(function () {
						draw (freq_arr);
					});
				}
			};

			/* 點一下畫面暫停／繼續（看清楚某一段頻譜用），暫停時標題顯示 PAUSED */
			canvas.addEventListener ('click', function () {
				paused = !paused;
				ttl.textContent = paused ? 'PAUSED' : L ('win.spec_analyser', 'SPECTRUM ANALYSER');
				ttl.style.opacity = paused ? '1' : '';
			});

			var last_press = 0;
			document.addEventListener ('keydown', function ( e ) {
				if ((e.keyCode || e.which) !== 32) return ;

				e.preventDefault ();
				e.stopPropagation ();

				if (e.repeat || e.timeStamp - last_press < 100) {
					return ;
				}

				last_press = e.timeStamp;

				if (!iframe) {
					w.opener && w.opener.PKAudioEditor.ui.Dock ('RequestKeyDown', 32);
				}
				else {
					w.parent && w.parent.PKAudioEditor.ui.Dock ('RequestKeyDown', 32);
				}
			}, true);

		}, 60);
	</script>

</body>
</html>
