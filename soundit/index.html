
<!DOCTYPE html>

<head>
	<title>Soundit 聲一</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Cpath d='M6 16v0M10 11v10M14 7v18M18 12v8M22 9v14M26 14v4' stroke='%235af2ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
	<meta charset="utf-8" />
	<script>
		if (location.protocol !== 'file:') {
			var link = document.createElement('link');
			link.rel = 'manifest';
			link.href = 'manifest.json';
			document.head.appendChild(link);
		}
		window.addEventListener('beforeinstallprompt', function (e) {
			e.preventDefault();
			window.__pkInstallPrompt = e;
		});
		window.addEventListener('appinstalled', function () {
			window.__pkInstallPrompt = null;
		});
	</script>

	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

	<meta name="description" content="Soundit 聲一 - 音訊編輯器 / Audio editor"/>
	<meta property="og:title" content="Soundit">
	<meta property="og:description" content="Audio editor">
	<link rel="apple-touch-icon" href="icon-192.png">
	<meta name="theme-color" content="#0a0a0a">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Soundit">

	<meta name="apple-mobile-web-app-status-bar-style" content="black">

	<style>html,body{touch-action:manipulation}</style>

	<script>
		try {
			var _l = PKLocale.getLang ();
			document.documentElement.lang = _l === 'kasu' ? 'hak-TW' : _l;
		} catch (e) {}
		var editor;
		try {
			editor = PKAudioEditor.init ('app');
		} catch (err) {
			console.error (err);
			var box = document.createElement ('div');
			box.style.cssText = 'color:#e8edf0;font:14px system-ui;padding:24px';
			box.textContent = '初始化失敗，請重新整理頁面。 / Failed to start, please reload.';
			document.body.appendChild (box);
		}

		/* 以已安裝的 PWA 開啟音訊檔（manifest 的 file_handlers）：直接載入進編輯器 */
		if (editor && 'launchQueue' in window && window.launchQueue.setConsumer) {
			window.launchQueue.setConsumer (function ( params ) {
				if (!params || !params.files || !params.files.length) return ;
				params.files[0].getFile ().then (function ( file ) {
					if (editor.engine && editor.engine.LoadFile) editor.engine.LoadFile ({ files: [ file ] });
				}).catch (function () {});
			});
		}
		if ('serviceWorker' in navigator && location.protocol !== 'file:') {
			window.addEventListener('load', function () {
				try {
					var rl = 0;
					function showUpdateNotice ( sw ) {
						if (document.getElementById('pk_upd')) return;
						var el = document.createElement('div');
						el.id = 'pk_upd';
						el.className = 'pk_oneup';
						el.style.cssText = 'top:58px;margin-top:0;opacity:1;transform:translateX(-50%);pointer-events:auto;font-size:13px';
						el.innerHTML = PKLocale.t('pwa.new_version') + ' <button class="pk_modal_a_bottom pk_modal_a_accpt" style="float:none;display:inline-block;margin-left:10px">' + PKLocale.t('pwa.reload') + '</button>';
						document.body.appendChild(el);
						el.getElementsByTagName('button')[0].onclick = function () {
							rl = 1;
							sw && sw.postMessage('SKIP_WAITING');
							setTimeout(function () { location.reload(); }, 900);
						};
					}
					navigator.serviceWorker.addEventListener('controllerchange', function () {
						if (rl) location.reload();
					});
					navigator.serviceWorker.register('sw.js').then(function (r) {
						function check (sw) {
							sw && (sw.state === 'installed' && navigator.serviceWorker.controller
								? showUpdateNotice(sw)
								: sw.onstatechange = function () {
									sw.state === 'installed' && navigator.serviceWorker.controller && showUpdateNotice(sw);
								});
						}
						r.waiting && navigator.serviceWorker.controller && showUpdateNotice(r.waiting);
						check(r.installing);
						r.onupdatefound = function () { check(r.installing); };
					});
				} catch (error) {}
			});
		}
	</script>
</body>
