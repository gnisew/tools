<!DOCTYPE html>
<html lang="en">
<head>
	<script>window.update = function(){};</script>
	<title>Soundit - Frequency Analysis</title>
	<style>
	html,body{height:100%}
	body{padding:0;margin:0;background:#111;position:relative;z-index:2;overflow:hidden;}
	div{position:absolute;top:50%;left:0;right:0;z-index:1;margin-top:-18px;text-align:center;user-select:none;
		font-size:28px;color:#191919;pointer-events:none;font-family:Arial}
	#e, #d, #f{
		cursor:pointer;
		position: absolute;
	    top: 7px;
	    right: 7px;
	    display: block;
	    height: 20px;
	    z-index: 99999;
	    background: #eaeaea;
	    left:auto;
	    border-radius:4px;
		color:#111;
		font:9px/20px Arial,sans-serif;
	    width: auto;
	    padding: 0 6px;
	    text-align: center;
	    opacity:0.9;
	    user-select:none;
	}

	.b #e, .b #d{
		top:12px;
	}

	#d{
		min-width:40px;
	}

	.b #e, .b #f{
		display:block;
	}

	#e{
		right: 68px;
	    width: 10px;
	    line-height: 20px;
	    padding: 0px 6px;
	    text-align: center;
	    opacity: 0.9;
	    display:none;
	}

	#f{
		left: 0;
	    right: 0;
	    top: 0;
	    padding: 0;
	    width: 100%;
	    line-height: 0;
	    border-radius: 0;
	    height: 4px;
	    background: #333;
	    display:none;
	    user-select:none;
	    -moz-user-select:none;
	}

	#d:focus-visible,#e:focus-visible{outline:2px solid #5af2ff;outline-offset:1px}

	.c #f, #f:hover{
		background:#3C3C3C;
	}

	</style>
	<meta charset="utf-8" />
</head>
<body>
	<canvas id="fr" width="600" height="188" style="width:100%;height:100%;display:block" aria-label="Frequency analyser"></canvas>
	<div id="ttl">FREQUENCY ANALYSER</div>

	<a id="d" role="button" tabindex="0" onclick="dock()">DOCK</a>
	<a id="e" role="button" tabindex="0" aria-label="Close" onclick="remove()">X</a>
	<a id="f" onmousedown="return drag(event)"></a>

	<script>
		var d = document;
		var w = window;
		var iframe = location.href.indexOf('?iframe') === -1 ? 0 : 1;

		/* 視窗文字走主視窗的 PKLocale；取不到就用英文 */
		function L ( key, fb ) {
			try {
				var h = iframe ? w.parent : w.opener;
				var s = h && h.PKLocale && h.PKLocale.t ( key );
				return s && s !== key ? s : fb;
			} catch (e) { return fb; }
		}
		d.getElementById ('ttl').textContent = L ('win.freq_analyser', 'FREQUENCY ANALYSER');
		d.getElementById ('d').textContent = L ('win.dock', 'DOCK');
		var canvas = d.getElementById('fr');
		var ctx = canvas.getContext('2d', {alpha:true, antialias:false});

		/* 鍵盤可操作：Enter / 空白鍵觸發 DOCK、X（空白鍵本身另外交給主視窗播放／暫停，所以只處理 Enter） */
		['d', 'e'].forEach (function ( id ) {
			d.getElementById (id).addEventListener ('keydown', function ( ev ) {
				if (ev.key === 'Enter') { ev.preventDefault (); ev.stopPropagation (); this.click (); }
			});
		});

		w.remove = function (){};
		if (iframe) {
			d.body.className = 'b';
			d.getElementById ('d').textContent = L ('win.undock', 'UNDOCK');
			w.remove = function () {
				w.parent.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'eq', [1, 1]);
			};
		};

		w.drag = function ( e ) {
			e.preventDefault ();
			e.stopPropagation ();
			e.returnValue = false;

			w.parent.PKAudioEditor.ui.Dock ('RequestDragI', 'eq', [e.screenX, e.screenY]);
			return false;
		};

		w.dock = function () {
			if (!iframe)
			{
				if (!w.opener || !w.opener.PKAudioEditor) {
					return ;
				}

				w.opener.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'eq', [1, 1]);
				w.close && w.close ();
			}
			else
			{
				var frm = w.parent.document.getElementById ('pk_fr' + 'eq');
				var t = 1;

				if (frm && frm.getBoundingClientRect) {
					var rect = frm.getBoundingClientRect();

					t = [(w.parent.screenLeft + rect.left + 100)||0, (w.parent.screenTop + rect.top + 25)||0];
				}

				w.parent.PKAudioEditor.ui.Dock ('RequestShowFreqAn', 'eq', [t, 0]);
			}
		};

		setTimeout(function () {
			if (!iframe)
			{
				if (!w.opener || !w.opener.PKAudioEditor) return ;
			}

			var bufferLength = 240;
			var value_changed = false;

			/* AnalyserNode 預設範圍 -100 ~ -30 dB（主程式沒改過），格線與數值讀出依此換算 */
			var DB_MIN = -100, DB_RANGE = 70;
			var GRID = [-40, -60, -80];

			/* 0~255 → 顏色查表，避免每幀組字串；原本 R 超過 255 時靠瀏覽器截斷，這裡明確截斷 */
			var LUT = [];
			for (var c = 0; c < 256; ++c) LUT[c] = 'rgb(' + Math.min (255, c + 100) + ',50,50)';

			var peaks = new Float32Array (bufferLength);
			var last_data = null;
			var hover_x = -1;
			var redraw_pending = false;

			/* 高解析螢幕：以裝置像素繪製，畫面不再模糊（上限 2 倍，避免過度耗電） */
			function fit () {
				var W = w.innerWidth, H = w.innerHeight;
				var r = Math.min (w.devicePixelRatio || 1, 2);
				var pw = Math.round (W * r), ph = Math.round (H * r);
				if (canvas.width !== pw || canvas.height !== ph) {
					canvas.width = pw;
					canvas.height = ph;
				}
				ctx.setTransform (r, 0, 0, r, 0, 0);
				return [W, H];
			}

			fit ();
			ctx.clearRect (0, 0, w.innerWidth, w.innerHeight);

			function draw ( data, redraw ) {
				if (!data) return ;
				var s = fit (), WIDTH = s[0], HEIGHT = s[1];
				last_data = data;

				ctx.fillStyle = 'rgb(0, 0, 0)';
				ctx.fillRect (0, 0, WIDTH, HEIGHT);

				/* dB 格線 */
				ctx.lineWidth = 1;
				ctx.font = '9px Arial';
				ctx.textBaseline = 'bottom';
				for (var g = 0; g < GRID.length; ++g) {
					var gy = Math.round (HEIGHT * (1 - (GRID[g] - DB_MIN) / DB_RANGE)) + 0.5;
					ctx.strokeStyle = '#1c1c1c';
					ctx.beginPath ();
					ctx.moveTo (0, gy);
					ctx.lineTo (WIDTH, gy);
					ctx.stroke ();
					ctx.fillStyle = '#4a4a4a';
					ctx.fillText (GRID[g] + ' dB', 4, gy - 1);
				}

				var barWidth = WIDTH / bufferLength;
				var x = 0;

				for (var i = 0; i < bufferLength; i += 1) {
					var v = data[i * 2] || 0;
					var h = ((v / 256) * HEIGHT) >> 0;

					ctx.fillStyle = LUT[v > 255 ? 255 : v];
					ctx.fillRect (x, HEIGHT - h, barWidth + 0.5, h);

					/* 峰值保持：慢慢落下的小橫線 */
					if (!redraw) peaks[i] = v >= peaks[i] ? v : Math.max (0, peaks[i] - 1.5);
					if (peaks[i] > 2) {
						ctx.fillStyle = '#ffd6d6';
						ctx.fillRect (x, HEIGHT - ((peaks[i] / 256) * HEIGHT) - 2, barWidth, 2);
					}
					x += barWidth;
				}

				/* 滑鼠指到的頻帶：顯示大約的 dB */
				if (hover_x >= 0 && hover_x < WIDTH) {
					var bi = Math.min (bufferLength - 1, (hover_x / barWidth) >> 0);
					var db = Math.round (DB_MIN + ((data[bi * 2] || 0) / 255) * DB_RANGE);
					var lx = Math.round (bi * barWidth + barWidth / 2) + 0.5;
					ctx.strokeStyle = 'rgba(255,255,255,.35)';
					ctx.beginPath ();
					ctx.moveTo (lx, 0);
					ctx.lineTo (lx, HEIGHT);
					ctx.stroke ();
					var label = db + ' dB';
					ctx.font = '11px Arial';
					ctx.textBaseline = 'top';
					var tw = ctx.measureText (label).width;
					var tx = lx + 6 + tw > WIDTH ? lx - 6 - tw : lx + 6;
					ctx.fillStyle = '#fff';
					ctx.fillText (label, tx, 6);
				}

				value_changed = false;
			};
			w.draw = draw;

			w.addEventListener ('pagehide', function () {
				w.destroy && w.destroy ( iframe );
				w.destroy = null;
			});

			w.update = function (freq_arr) {
				if (!freq_arr) {
					peaks.fill (0);
					last_data = null;
					ctx.clearRect (0, 0, w.innerWidth, w.innerHeight);
				}
				else {
					if (value_changed) return ;
					value_changed = true;

					window.requestAnimationFrame(function () {
						draw (freq_arr);
					});
				}
			};

			/* 暫停播放時也要能跟著滑鼠／視窗大小重畫 */
			function requestRedraw () {
				if (redraw_pending || !last_data) return ;
				redraw_pending = true;
				w.requestAnimationFrame (function () {
					redraw_pending = false;
					last_data && draw (last_data, true);
				});
			}
			canvas.addEventListener ('mousemove', function ( e ) { hover_x = e.clientX; requestRedraw (); });
			canvas.addEventListener ('mouseleave', function () { hover_x = -1; requestRedraw (); });
			w.addEventListener ('resize', requestRedraw);

			/* 空白鍵交給主視窗播放／暫停。keypress 已被瀏覽器標為過時，改用 keydown；
			 * 用捕捉階段，避免焦點在 DOCK / X 按鈕上時被當成按下按鈕 */
			var last_press = 0;
			document.addEventListener ('keydown', function ( e ) {
				if ((e.keyCode || e.which) !== 32) return ;

				e.preventDefault ();
				e.stopPropagation ();

				if (e.repeat || e.timeStamp - last_press < 100) {
					return ;
				}

				last_press = e.timeStamp;

				if (!iframe) {
					w.opener && w.opener.PKAudioEditor.ui.Dock ('RequestKeyDown', 32);
				}
				else {
					w.parent && w.parent.PKAudioEditor.ui.Dock ('RequestKeyDown', 32);
				}
			}, true);

		}, 60);
	</script>

</body>
</html>
