<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批次壓縮工具</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#1b2433;--sub:#5d6b82;--line:#d9e0ec;--brand:#1a6ef0;--ok:#16794a;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--panel:#18202e;--text:#e6ebf5;--sub:#9aa7bd;--line:#2a3548;--brand:#5b9bff;--ok:#4cc38a;--err:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--sub)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
#drop{border:2px dashed var(--line);text-align:center;padding:28px 12px;cursor:pointer}
#drop.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent)}
#drop b{display:block;font-size:17px;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,label.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
button.main{background:var(--brand);border-color:var(--brand);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within,#drop:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.opt{display:block;margin:6px 0}
.opt small{color:var(--sub);display:block;margin-left:24px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.err{color:var(--err);white-space:normal}
#files{margin:8px 0 0;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<main>
<h1>批次壓縮工具</h1>
<p class="sub">移除註解與空白、縮短變數與函數名稱。檔案只在你的瀏覽器處理，不會上傳。</p>

<section id="drop" tabindex="0" role="button" aria-label="選擇或拖曳檔案">
  <b>把檔案或資料夾拖到這裡</b>
  <span class="sub">或點一下選擇檔案（支援 .js .css .html .svg .json .webmanifest，其他檔案原樣放進 ZIP）</span>
  <div class="row" style="justify-content:center">
    <label class="btn">選擇檔案<input id="pickF" type="file" multiple hidden></label>
    <label class="btn">選擇資料夾<input id="pickD" type="file" webkitdirectory hidden></label>
  </div>
  <div id="files"></div>
</section>

<section>
  <b>JavaScript 選項</b>
  <label class="opt"><input type="checkbox" id="oCompress" checked> 壓縮語法（合併敘述、簡化運算式）</label>
  <label class="opt"><input type="checkbox" id="oMangle" checked> 縮短區域名稱（函數內的變數、參數、內部函數）
    <small>安全。全域函數與全域變數的名稱不會改，HTML 的 onclick 與跨檔案呼叫不受影響。</small></label>
  <label class="opt"><input type="checkbox" id="oConsole"> 移除 console.log 等除錯輸出</label>
</section>

<section>
  <div class="row" style="margin:0">
    <button class="main" id="go" disabled>開始壓縮</button>
    <button id="zip" disabled>下載 ZIP（dist 資料夾）</button>
    <button id="clear">清除</button>
  </div>
  <div class="scroll" style="margin-top:12px">
    <table id="tbl" hidden>
      <thead><tr><th>檔案</th><th class="n">原始</th><th class="n">壓縮後</th><th class="n">節省</th><th>狀態</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/terser@5.31.0/dist/bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const TEXT = /\.(js|mjs|css|html?|svg|json|webmanifest)$/i;
let items = [];   // {path, file, out(Blob), size, outSize, msg, ok}

/* ---------- 加入檔案 ---------- */
function addFiles(list) {
  for (const f of list) {
    const path = f.fullPath || f.webkitRelativePath || f.name;
    if (!items.some(i => i.path === path)) items.push({ path: path.replace(/^\//, ''), file: f });
  }
  $('files').textContent = items.length ? '已加入 ' + items.length + ' 個檔案' : '';
  $('go').disabled = !items.length;
}
$('pickF').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('pickD').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('drop').onclick = e => { if (!e.target.closest('label')) $('pickF').click(); };
$('drop').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('pickF').click(); } };
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('on'); }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('on'); }));
$('drop').addEventListener('drop', async e => {
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = [];
  const walk = async en => {
    if (en.isFile) { const f = await new Promise(r => en.file(r)); f.fullPath = en.fullPath; out.push(f); }
    else { const rd = en.createReader(); let b; do { b = await new Promise(r => rd.readEntries(r)); for (const c of b) await walk(c); } while (b.length); }
  };
  for (const en of entries) await walk(en);
  addFiles(out.length ? out : e.dataTransfer.files);
});
$('clear').onclick = () => { items = []; $('files').textContent = ''; $('go').disabled = $('zip').disabled = true; $('tbl').hidden = true; };

/* ---------- 各類型壓縮 ---------- */
function opts() {
  return { compress: $('oCompress').checked, mangle: $('oMangle').checked, drop: $('oConsole').checked };
}
async function minJs(code, o) {
  if (typeof Terser === 'undefined') throw new Error('Terser 載入失敗（需要網路）');
  const run = async useCompress => {
    const r = await Terser.minify(code, {
      compress: useCompress ? { drop_console: o.drop } : false,
      mangle: o.mangle ? { toplevel: false } : false,
      format: { comments: false }
    });
    return r.code || '';
  };
  const bytes = s => new Blob([s]).size;   // 用位元組比大小，不是字數
  let out = await run(o.compress);
  if (o.compress && bytes(out) >= bytes(code)) {   // 變大了就改用「不壓縮語法」重試
    const alt = await run(false);
    if (bytes(alt) < bytes(out)) out = alt;
  }
  return out;
}
function minCss(s) {
  s = s.replace(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\/\*[\s\S]*?\*\//g, (m, str) => str || '');
  return s.split(/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|url\([^)]*\))/g)
    .map((p, i) => i % 2 ? p : p.replace(/\s+/g, ' ').replace(/\s*([{};,])\s*/g, '$1').replace(/:\s+/g, ':').replace(/;}/g, '}'))
    .join('').trim();
}
async function minHtml(s, o) {
  const blocks = [];
  s = s.replace(/<(script|style|pre|textarea)\b([^>]*)>([\s\S]*?)<\/\1>/gi, (m, tag, attr, body) => {
    blocks.push({ m, tag: tag.toLowerCase(), attr, body });
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/<!--(?!\[if)[\s\S]*?-->/g, '').replace(/\s+/g, ' ').trim();
  for (const b of blocks) {
    const type = (/type\s*=\s*["']?([^"'\s>]+)/i.exec(b.attr) || [])[1] || '';
    const isJs = !type || /javascript|module/i.test(type);
    b.out = b.m;
    if (b.tag === 'style') b.out = '<style' + b.attr + '>' + minCss(b.body) + '</style>';
    else if (b.tag === 'script' && isJs && b.body.trim()) b.out = '<script' + b.attr + '>' + await minJs(b.body, o) + '<\/script>';
  }
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i].out);
}
async function minify(name, text, o) {
  const ext = name.split('.').pop().toLowerCase();
  if (ext === 'js' || ext === 'mjs') return minJs(text, o);
  if (ext === 'css') return minCss(text);
  if (ext === 'html' || ext === 'htm' || ext === 'svg') return minHtml(text, o);
  return JSON.stringify(JSON.parse(text));   // json、webmanifest
}

/* ---------- 執行 ---------- */
const kb = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
$('go').onclick = async () => {
  const o = opts(), tb = $('tbl').tBodies[0];
  $('go').disabled = true; tb.textContent = ''; $('tbl').hidden = false;
  for (const it of items) {
    it.size = it.file.size; it.ok = false; it.outSize = it.size;
    try {
      if (TEXT.test(it.path)) {
        const out = await minify(it.path, await it.file.text(), o);
        const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
        if (blob.size >= it.size) {   // 沒變小就保留原檔
          it.out = it.file; it.msg = '壓縮後沒有變小，保留原檔';
        } else {
          it.out = blob; it.outSize = blob.size; it.ok = true; it.msg = '完成';
        }
      } else { it.out = it.file; it.msg = '原樣複製'; }
    } catch (err) { it.out = it.file; it.msg = '失敗，保留原檔：' + err.message; it.bad = true; }
    const tr = tb.insertRow();
    const save = it.size ? Math.round((1 - it.outSize / it.size) * 100) + '%' : '';
    [it.path, kb(it.size), kb(it.outSize), it.ok ? save : '', it.msg].forEach((t, i) => {
      const td = tr.insertCell(); td.textContent = t;
      if (i === 1 || i === 2 || i === 3) td.className = 'n';
      if (i === 4) td.className = it.bad ? 'err' : it.ok ? 'ok' : '';
    });
    const b = document.createElement('button'); b.textContent = '下載';
    b.onclick = () => save1(it); tr.insertCell().appendChild(b);
  }
  $('go').disabled = false; $('zip').disabled = false;
};
function save1(it) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(it.out); a.download = it.path.split('/').pop(); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('zip').onclick = async () => {
  if (typeof JSZip === 'undefined') return alert('JSZip 載入失敗（需要網路）');
  const z = new JSZip();
  items.forEach(it => z.file('dist/' + it.path, it.out));
  const blob = await z.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dist.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
</script>
</body>
</html>
